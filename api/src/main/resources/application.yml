spring:
  application:
    name: weyvo-api
  config:
    # Local secrets: the git-ignored .env at the project root (run from api/ or the root). Optional, so
    # deployed environments rely on real environment variables instead.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/weyvo}
    username: ${DATABASE_USER:weyvo}
    password: ${DATABASE_PASSWORD:weyvo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

logging:
  file:
    # Local development writes api/logs/weyvo-api.log as well as the console. Hosts like Render
    # collect console output, so set LOG_FILE to empty there.
    name: ${LOG_FILE:logs/weyvo-api.log}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # Local development only. Set APP_JWT_SECRET (32+ random bytes, base64) in every deployed environment.
    secret: ${APP_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtZGVwbG95aW5nLTEyMzQ1Ng==}
    ttl: ${APP_JWT_TTL:PT168H}
  cookie:
    name: weyvo_session
    secure: ${APP_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  story:
    # Share of a public story's sections returned before sign-in.
    free-share: 0.6
  signup:
    # Reject email domains with no mail server (DNS MX/A lookup). Throwaway inboxes are always rejected.
    check-mail-domain: ${APP_SIGNUP_CHECK_MAIL_DOMAIN:true}
  community:
    questions-per-hour: ${COMMUNITY_QUESTIONS_PER_HOUR:10}
    # A question is hidden automatically once this many different people report it.
    reports-to-hide: ${COMMUNITY_REPORTS_TO_HIDE:3}
  plans:
    # Low values for testing. Raise with environment variables for launch (no code change needed).
    # For total-photos and uploads-per-hour, 0 means unlimited.
    free:
      full-trip-sections: ${PLAN_FREE_FULL_TRIP_SECTIONS:3}   # each section can hold one photo, plus the cover
      short-story-photos: ${PLAN_FREE_SHORT_STORY_PHOTOS:4}
      total-photos: ${PLAN_FREE_TOTAL_PHOTOS:20}
      uploads-per-hour: ${PLAN_FREE_UPLOADS_PER_HOUR:10}
    premium:
      full-trip-sections: ${PLAN_PREMIUM_FULL_TRIP_SECTIONS:8}
      short-story-photos: ${PLAN_PREMIUM_SHORT_STORY_PHOTOS:8}
      total-photos: ${PLAN_PREMIUM_TOTAL_PHOTOS:0}
      uploads-per-hour: ${PLAN_PREMIUM_UPLOADS_PER_HOUR:60}
  storage:
    # local: files under local-dir (development). supabase: private Supabase Storage bucket.
    provider: ${APP_STORAGE_PROVIDER:local}
    local-dir: ${APP_STORAGE_LOCAL_DIR:data/photos}
    supabase-url: ${SUPABASE_URL:}
    supabase-service-key: ${SUPABASE_SERVICE_KEY:}
    supabase-bucket: ${SUPABASE_BUCKET:trip-photos}
