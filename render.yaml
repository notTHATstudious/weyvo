# Render Blueprint: New → Blueprint → pick this repo. Render creates both services and asks for every
# value marked sync: false (secrets). Paste those into Render yourself; they never go in Git.
#
# The web app forwards /api to the API, so the browser sees one site and the login cookie just works.
# If Render gives either service a different address than below (names already taken), update
# the /api rewrite, APP_URL and APP_CORS_ORIGINS to match.

services:
  - type: web
    name: weyvo-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /api/billing/plans
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://weyvo-web.onrender.com
      - key: APP_CORS_ORIGINS
        value: https://weyvo-web.onrender.com
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: APP_STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_BUCKET
        value: trip-photos
      # Supabase's free pooler allows few connections; a small pool is plenty here.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      # Random 256-bit session key, made by Render once and kept.
      - key: APP_JWT_SECRET
        generateValue: true
      # Visitor IP for rate limits: X-Forwarded-For, skipping the 3 addresses Render's proxies append on the
      # right (web forwarding /api adds hops). Confirm at /api/admin/request-info: clientIp must be your own IP.
      - key: APP_CLIENT_IP_HEADER
        value: X-Forwarded-For
      - key: APP_CLIENT_IP_TRUSTED_HOPS
        value: "3"
      # Secrets and per-account values: Render asks for these on the first deploy.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: weyvo-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://weyvo-api.onrender.com/api/*
      # Single-page app: every other path is served by index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Built files have content hashes in their names, so browsers can keep them for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
