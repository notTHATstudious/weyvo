# Render's free plan sleeps the API after 15 idle minutes, and Supabase's free plan pauses a project after a
# week without use. A light request every 10 minutes keeps both awake. Free for public repositories.
name: Keep Weyvo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API (reads the destinations list from the database)
        run: curl --silent --show-error --output /dev/null --max-time 120 --retry 2 --retry-delay 20 https://weyvo-web.onrender.com/api/places
